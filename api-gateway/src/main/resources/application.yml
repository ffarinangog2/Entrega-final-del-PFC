server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/auth/**

          - id: usuarios-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/v1/usuarios/**

          - id: academico-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/v1/academico/**

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.server.mvc: TRACE
