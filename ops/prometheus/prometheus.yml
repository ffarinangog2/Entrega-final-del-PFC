global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules/freddy-reservas.yml

scrape_configs:
  - job_name: reservas-solicitudes-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - reservas-solicitudes-service:8084
  
  - job_name: academico-laboratorios-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - academico-laboratorios-service:8083