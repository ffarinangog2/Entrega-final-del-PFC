groups:
  - name: freddy-reservas-http
    rules:
      - record: http_request_duration_seconds_bucket
        expr: http_server_requests_seconds_bucket{job="reservas-solicitudes-service"}
      - record: http_request_duration_seconds_sum
        expr: http_server_requests_seconds_sum{job="reservas-solicitudes-service"}
      - record: http_request_duration_seconds_count
        expr: http_server_requests_seconds_count{job="reservas-solicitudes-service"}
