apiVersion: 1

groups:
  - orgId: 1
    name: auditoria-seguridad
    folder: Auditoria y Seguridad
    interval: 1m
    rules:
      - uid: audit-login-fallido-fuerza-bruta
        title: Posibles intentos de fuerza bruta (login_fallido)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              expr: >-
                sum by (usuario, ip) (count_over_time({service_name="auth-service"}
                | evento="login_fallido" [5m]))
              queryType: instant
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
        labels:
          severidad: alta
          categoria: seguridad
        annotations:
          summary: >-
            Mas de 5 login_fallido del mismo usuario/IP en los ultimos 5
            minutos (posible fuerza bruta / credential stuffing).
