server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:26257/auth_db?sslmode=disable&options=-c%20allow_unsafe_internals%3Dtrue}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

security:
  jwt:
    issuer: ${JWT_ISSUER:scli-auth-service}
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

usuarios:
  service:
    url: ${USUARIOS_SERVICE_URL:http://localhost:8082}
    timeout-ms: ${USUARIOS_SERVICE_TIMEOUT_MS:3000}

app:
  internal-api-key: ${INTERNAL_API_KEY:clave-interna-desarrollo}
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:3000/restablecer-contrasena}
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:20}
    mail-from: ${MAIL_FROM:no-reply@scli.local}
