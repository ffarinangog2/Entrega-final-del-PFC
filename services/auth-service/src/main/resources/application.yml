server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://otel-collector:4318/v1/logs}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: auth-service
      rename:
        traceId: trace_id
        spanId: span_id

security:
  jwt:
    issuer: ${JWT_ISSUER:scli-auth-service}
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

usuarios:
  service:
    url: ${USUARIOS_SERVICE_URL:http://localhost:8082}
    timeout-ms: ${USUARIOS_SERVICE_TIMEOUT_MS:3000}

app:
  internal-api-key: ${INTERNAL_API_KEY:clave-interna-desarrollo}
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:3000/restablecer-contrasena}
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:20}
    mail-from: ${MAIL_FROM:no-reply@scli.local}
