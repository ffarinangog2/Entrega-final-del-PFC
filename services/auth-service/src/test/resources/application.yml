server:
  port: 0

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:26257/auth_db
    username: root
    password: ""
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: localhost
    port: 1025

security:
  jwt:
    issuer: scli-auth-service
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

usuarios:
  service:
    url: http://localhost:8082
    timeout-ms: 3000

app:
  internal-api-key: test-internal-api-key
  password-reset:
    base-url: http://localhost:3000/restablecer-contrasena
    expiration-minutes: 20
    mail-from: no-reply@scli.local
