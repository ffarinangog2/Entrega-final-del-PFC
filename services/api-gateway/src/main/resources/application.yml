server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
            predicates:
              - Path=/api/v1/auth/**

          - id: usuarios-service
            uri: ${USUARIOS_SERVICE_URL:http://usuarios-service:8082}
            predicates:
              - Path=/api/v1/usuarios/**

          - id: academico-service
            uri: ${ACADEMICO_SERVICE_URL:http://academico-laboratorios-service:8083}
            predicates:
              - Path=/api/v1/campus/**,/api/v1/bloques/**,/api/v1/pisos/**,/api/v1/laboratorios/**,/api/v1/equipos/**,/api/v1/tipos-equipo/**,/api/v1/facultades/**,/api/v1/carreras/**,/api/v1/materias/**,/api/v1/periodos-lectivos/**,/api/v1/horarios/**

security:
  jwt:
    issuer: ${JWT_ISSUER:scli-auth-service}
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.server.mvc: TRACE
