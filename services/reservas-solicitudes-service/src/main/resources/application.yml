server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: reservas-solicitudes-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:26260/reservas_db?sslmode=disable&options=-c%20allow_unsafe_internals%3Dtrue}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  jackson:
    time-zone: UTC

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    ec.edu.scli.reservas: ${LOG_LEVEL_APP:INFO}
    org.springframework.web.client: ${LOG_LEVEL_REST_CLIENT:WARN}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

  health:
    db:
      enabled: true

security:
  jwt:
    issuer: ${JWT_ISSUER:scli-auth-service}
    secret: ${JWT_SECRET}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app:
  internal-api-key: ${INTERNAL_API_KEY:clave-interna-desarrollo}

  services:
    usuarios:
      base-url: ${USUARIOS_SERVICE_URL:http://localhost:8082}

    academico-laboratorios:
      base-url: ${ACADEMICO_LABORATORIOS_SERVICE_URL:http://localhost:8083}

  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:3000}
    max-read-retries: ${HTTP_MAX_READ_RETRIES:2}

  idempotency:
    header-name: Idempotency-Key
