server:
  port: 0

spring:
  application:
    name: usuarios-service
  datasource:
    url: jdbc:postgresql://localhost:26258/usuarios_db
    username: root
    password: ""
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    issuer: scli-auth-service
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

app:
  internal-api-key: test-internal-api-key
  security:
    data-encryption-key: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyExMjM0
    data-hash-key: dGVzdC1oYXNoLWtleS0zMi1ieXRlcy1mb3ItaG1hYzEyMzQ=
