spring:
  datasource:
    url: jdbc:h2:mem:academico_context_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

security:
  jwt:
    issuer: scli-auth-service
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

app:
  internal-api-key: internal-context-test-key

management:
  tracing:
    enabled: false
