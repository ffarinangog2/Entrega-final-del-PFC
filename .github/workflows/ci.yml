name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint - backend and web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/academico-laboratorios-service/pom.xml

      - name: Checkstyle - academico-laboratorios-service
        working-directory: services/academico-laboratorios-service
        run: mvn --batch-mode checkstyle:check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: ESLint - apps/web
        working-directory: apps/web
        run: npm run lint
  test-backend:
    name: Build and test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: services/auth-service
            database: auth_db
          - service: services/usuarios-service
            database: usuarios_db
          - service: services/academico-laboratorios-service
            database: academico_db
          - service: services/reservas-solicitudes-service
            database: reservas_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Start CockroachDB for tests
        run: |
          docker run --name ci-cockroach --detach \
            --publish 26257:26257 \
            cockroachdb/cockroach:v26.2.0 \
            start-single-node --insecure

          for attempt in {1..30}; do
            if docker exec ci-cockroach cockroach sql \
              --insecure \
              --host=localhost:26257 \
              --execute="SELECT 1"; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              docker logs ci-cockroach
              exit 1
            fi

            sleep 2
          done

          docker exec ci-cockroach cockroach sql \
            --insecure \
            --host=localhost:26257 \
            --execute="CREATE DATABASE IF NOT EXISTS ${{ matrix.database }};"

      - name: Prepare test environment
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DATA_HASH_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Generate consumer Pacts
        if: ${{ matrix.service == 'services/reservas-solicitudes-service' || matrix.service == 'services/usuarios-service' }}
        run: >-
          mvn --batch-mode
          -f tests/contract/pom.xml
          -Dpact.rootDir="$GITHUB_WORKSPACE/tests/contract/target/pacts"
          test

      - name: Build and test
        working-directory: ${{ matrix.service }}
        env:
          DB_URL: jdbc:postgresql://localhost:26257/${{ matrix.database }}?sslmode=disable&options=-c%20allow_unsafe_internals%3Dtrue
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: mvn --batch-mode verify

  crdb-tests:
    name: CockroachDB E3 tests
    runs-on: ubuntu-latest
    needs: test-backend
    if: ${{ vars.CRDB_E3_TESTS_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pending Paso 2
        run: |
          echo "TODO(Paso 2 - Freddy): habilitar las pruebas cuando exista db/schema.sql y crdb-e3-init esté completo."

  test-web:
    name: Test web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web unit tests
        working-directory: apps/web
        run: npm test -- --run

      - name: Build web
        working-directory: apps/web
        run: npm run build

  test-mobile:
    name: Test mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run mobile unit tests
        working-directory: apps/mobile
        run: |
          chmod +x gradlew
          ./gradlew test

  build-mobile-apk:
    name: Build mobile APK
    runs-on: ubuntu-latest
    needs: test-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: apps/mobile
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scli-mobile-debug-${{ github.sha }}
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk

  build-images:
    name: Build and publish image - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: services/auth-service
          - name: usuarios-service
            context: services/usuarios-service
          - name: academico-laboratorios-service
            context: services/academico-laboratorios-service
          - name: reservas-solicitudes-service
            context: services/reservas-solicitudes-service
          - name: api-gateway
            context: services/api-gateway
          - name: web
            context: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/scli-${{ matrix.name }}:${{ github.sha }}

  integration:
    name: Compose integration tests
    runs-on: ubuntu-latest
    needs: build-images
    env:
      VITE_API_URL: http://127.0.0.1:8080
      VITE_API_BASE_URL: http://127.0.0.1:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Start stack and run integration checks
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-integration-secret-change-me' }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY || 'KwDuK6XBqOlQoHHizYNnUk6YTmD8zxiiqkjOlC8exIs=' }}
          DATA_HASH_KEY: ${{ secrets.DATA_HASH_KEY || '2KHYNo4a7kZmBuZmJ2sTLNUjHFXpzDG6rk6Z/1rQ6lI=' }}
        run: |
          set -Eeuo pipefail

          docker compose up -d --build

          wait_for_health() {
            local service="$1"
            local container
            local health

            for attempt in {1..60}; do
              container="$(docker compose ps -q "$service")"
              if [ -n "$container" ]; then
                health="$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
                if [ "$health" = "healthy" ]; then
                  echo "$service is healthy"
                  return 0
                fi
              fi
              sleep 5
            done

            echo "Timed out waiting for $service to become healthy"
            docker compose ps
            return 1
          }

          for service in \
            cockroach-auth auth-service \
            cockroach-usuarios usuarios-service \
            cockroach-academico academico-laboratorios-service \
            reservas-solicitudes-service api-gateway; do
            wait_for_health "$service"
          done

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API Gateway health endpoint did not become available"
              exit 1
            fi
            sleep 2
          done

          login_status="$(curl --silent --show-error \
            --output /tmp/login-response.json \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"username":"admin","password":"Admin123!"}' \
            http://localhost:8080/api/v1/auth/login)"
          case "$login_status" in
            2*) ;;
            *)
              echo "LOGIN_HTTP_STATUS=$login_status"
              node -e "try { const body = JSON.parse(require('fs').readFileSync(0, 'utf8')); console.error(body.message || 'Login request failed'); } catch { console.error('Login request failed'); }" < /tmp/login-response.json
              exit 1
              ;;
          esac

          access_token="$(node -e "try { const body = JSON.parse(require('fs').readFileSync(0, 'utf8')); process.stdout.write(body.accessToken || ''); } catch {}" < /tmp/login-response.json)"
          if [ -z "$access_token" ]; then
            echo "Login succeeded but accessToken was not present"
            exit 1
          fi

          response_status="$(curl --silent --show-error \
            --output /tmp/campus-response.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $access_token" \
            http://localhost:8080/api/v1/campus)"
          case "$response_status" in
            2*) ;;
            *) echo "Gateway functional request returned HTTP $response_status"; cat /tmp/campus-response.json; exit 1 ;;
          esac

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run web E2E tests
        working-directory: apps/web
        run: npm run test:e2e -- --project=chromium

      - name: Cleanup integration stack
        if: always()
        run: |
          docker compose logs || true
          docker compose down -v || true
