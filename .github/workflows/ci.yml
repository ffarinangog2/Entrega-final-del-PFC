name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint - backend and web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/academico-laboratorios-service/pom.xml

      - name: Checkstyle - academico-laboratorios-service
        working-directory: services/academico-laboratorios-service
        run: mvn --batch-mode checkstyle:check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: ESLint - apps/web
        working-directory: apps/web
        run: npm run lint
  test-backend:
    name: Build and test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: services/auth-service
            database: auth_db
          - service: services/usuarios-service
            database: usuarios_db
          - service: services/academico-laboratorios-service
            database: academico_db
          - service: services/reservas-solicitudes-service
            database: reservas_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Start CockroachDB for tests
        run: |
          docker run --name ci-cockroach --detach \
            --publish 26257:26257 \
            cockroachdb/cockroach:v26.2.0 \
            start-single-node --insecure

          for attempt in {1..30}; do
            if docker exec ci-cockroach cockroach sql \
              --insecure \
              --host=localhost:26257 \
              --execute="SELECT 1"; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              docker logs ci-cockroach
              exit 1
            fi

            sleep 2
          done

          docker exec ci-cockroach cockroach sql \
            --insecure \
            --host=localhost:26257 \
            --execute="CREATE DATABASE IF NOT EXISTS ${{ matrix.database }};"

      - name: Prepare test environment
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Generate Reservas consumer Pact
        if: ${{ matrix.service == 'services/reservas-solicitudes-service' }}
        run: >-
          mvn --batch-mode
          -f tests/contract/pom.xml
          -Dpact.rootDir="$GITHUB_WORKSPACE/tests/contract/target/pacts"
          test

      - name: Build and test
        working-directory: ${{ matrix.service }}
        env:
          DB_URL: jdbc:postgresql://localhost:26257/${{ matrix.database }}?sslmode=disable&options=-c%20allow_unsafe_internals%3Dtrue
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: mvn --batch-mode verify

  crdb-tests:
    name: CockroachDB E3 tests
    runs-on: ubuntu-latest
    needs: test-backend
    if: ${{ vars.CRDB_E3_TESTS_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pending Paso 2
        run: |
          echo "TODO(Paso 2 - Freddy): habilitar las pruebas cuando exista db/schema.sql y crdb-e3-init esté completo."

  test-web:
    name: Test web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web unit tests
        working-directory: apps/web
        run: npm test -- --run

      - name: Build web
        working-directory: apps/web
        run: npm run build

  test-mobile:
    name: Test mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run mobile unit tests
        working-directory: apps/mobile
        run: |
          chmod +x gradlew
          ./gradlew test

  build-mobile-apk:
    name: Build mobile APK
    runs-on: ubuntu-latest
    needs: test-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: apps/mobile
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scli-mobile-debug-${{ github.sha }}
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk

  build-images:
    name: Build and publish image - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: services/auth-service
          - name: usuarios-service
            context: services/usuarios-service
          - name: academico-laboratorios-service
            context: services/academico-laboratorios-service
          - name: reservas-solicitudes-service
            context: services/reservas-solicitudes-service
          - name: api-gateway
            context: services/api-gateway
          - name: web
            context: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/scli-${{ matrix.name }}:${{ github.sha }}

  integration:
    name: Compose integration tests
    runs-on: ubuntu-latest
    needs: build-images
    env:
      VITE_API_URL: http://localhost:8080
      VITE_API_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Start stack and run integration checks
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-integration-secret-change-me' }}
        run: |
          set -Eeuo pipefail

          cleanup() {
            docker compose logs || true
            docker compose down -v || true
          }
          trap cleanup EXIT

          docker compose up -d --build

          wait_for_health() {
            local service="$1"
            local container
            local health

            for attempt in {1..60}; do
              container="$(docker compose ps -q "$service")"
              if [ -n "$container" ]; then
                health="$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
                if [ "$health" = "healthy" ]; then
                  echo "$service is healthy"
                  return 0
                fi
              fi
              sleep 5
            done

            echo "Timed out waiting for $service to become healthy"
            docker compose ps
            return 1
          }

          for service in \
            cockroach-auth auth-service \
            cockroach-usuarios usuarios-service \
            cockroach-academico academico-laboratorios-service \
            reservas-solicitudes-service api-gateway; do
            wait_for_health "$service"
          done

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API Gateway health endpoint did not become available"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://localhost:8081/actuator/health >/dev/null

          echo "Checking admin user in the clean auth database"
          docker compose exec -T cockroach-auth cockroach sql \
            --insecure \
            --host=localhost:26257 \
            --database=auth_db \
            --execute="SELECT username, activo FROM usuarios_auth WHERE username = 'admin';"

          echo "Checking login through the API Gateway with the SPA Origin"
          set +e
          curl --silent --show-error -i \
            -H "Content-Type: application/json" \
            -H "Origin: http://localhost:5173" \
            -d '{"username":"admin","password":"Admin123!"}' \
            http://localhost:8080/api/v1/auth/login \
            > /tmp/login-origin-response.txt 2>&1
          login_exit_code=$?
          set -e
          login_status="$(sed -n '1s/^HTTP\/[0-9.]* \([0-9][0-9][0-9]\).*/\1/p' /tmp/login-origin-response.txt)"
          login_allow_origin="$(grep -i '^Access-Control-Allow-Origin:' /tmp/login-origin-response.txt | head -n 1 | tr -d '\r' || true)"
          echo "LOGIN_ORIGIN_HTTP_STATUS=${login_status:-unavailable}"
          echo "${login_allow_origin:-Access-Control-Allow-Origin: unavailable}"
          if [ "$login_exit_code" -ne 0 ]; then
            echo "API login check failed with curl exit code $login_exit_code"
            exit "$login_exit_code"
          fi
          if [ "$login_allow_origin" != "Access-Control-Allow-Origin: http://localhost:5173" ]; then
            echo "API login response did not allow the SPA Origin"
            exit 1
          fi

          echo "Checking CORS preflight for the Vite SPA"
          curl --fail-with-body --silent --show-error --include -X OPTIONS \
            http://localhost:8080/api/v1/auth/login \
            -H "Origin: http://localhost:5173" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type"

          response_status="$(curl --silent --show-error --output /tmp/campus-response.json --write-out '%{http_code}' http://localhost:8080/api/v1/campus)"
          case "$response_status" in
            2*) ;;
            *) echo "Gateway functional request returned HTTP $response_status"; cat /tmp/campus-response.json; exit 1 ;;
          esac

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Diagnose browser login request
        working-directory: apps/web
        shell: bash
        run: |
          set -Eeuo pipefail
          diagnostic_spec="$(mktemp --suffix=.spec.ts)"
          trap 'rm -f "$diagnostic_spec"' EXIT

          cat > "$diagnostic_spec" <<'EOF'
          import { test } from '@playwright/test'

          test('diagnose browser login request', async ({ page }) => {
            const loginUrl = 'http://localhost:8080/api/v1/auth/login'

            page.on('console', (message) => {
              console.log(`[browser console:${message.type()}] ${message.text()}`)
            })
            page.on('pageerror', (error) => {
              console.log(`[pageerror] ${error.message}`)
            })
            page.on('requestfailed', (request) => {
              console.log(
                `[requestfailed] ${request.method()} ${request.url()} error=${request.failure()?.errorText ?? 'unknown'}`,
              )
            })
            page.on('request', (request) => {
              if (request.url() === loginUrl) {
                console.log(`[request] ${request.method()} ${request.url()}`)
              }
            })
            page.on('response', (response) => {
              if (response.url() === loginUrl) {
                console.log(
                  `[response] ${response.request().method()} ${response.url()} status=${response.status()} headers=${JSON.stringify(response.headers())}`,
                )
              }
            })

            await page.goto('/login')
            const result = await page.evaluate(async (url) => {
              try {
                const response = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ username: 'admin', password: 'Admin123!' }),
                })

                return {
                  status: response.status,
                  ok: response.ok,
                  error: null,
                  allowOrigin: response.headers.get('Access-Control-Allow-Origin'),
                }
              } catch (error) {
                return {
                  status: null,
                  ok: false,
                  error: error instanceof Error ? error.message : String(error),
                  allowOrigin: null,
                }
              }
            }, loginUrl)

            console.log(
              `[fetch] status=${result.status ?? 'unavailable'} ok=${result.ok} error=${result.error ?? 'none'} Access-Control-Allow-Origin=${result.allowOrigin ?? 'unavailable'}`,
            )
          })
          EOF

          npx playwright test "$diagnostic_spec" --config=playwright.config.ts --project=chromium

      - name: Show web API configuration
        run: |
          echo "VITE_API_URL=$VITE_API_URL"
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
          echo "SPA_BASE_URL=http://localhost:5173"
          echo "AUTH_LOGIN_URL=${VITE_API_URL}/api/v1/auth/login"

      - name: Run web E2E tests
        working-directory: apps/web
        run: npm run test:e2e -- --project=chromium
