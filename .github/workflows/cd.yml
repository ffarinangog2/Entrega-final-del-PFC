name: CD

on:
  workflow_call:
    inputs:
      image_tag:
        description: Full Git SHA approved by CI and published to GHCR
        required: true
        type: string
      deploy_ref:
        description: Git ref or branch name to fetch on the deployment server
        required: true
        type: string
    secrets:
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
      SERVER_SSH_KEY:
        required: true
      SERVER_SSH_PORT:
        required: true
      SERVER_SSH_FINGERPRINT:
        required: true
      GHCR_USERNAME:
        required: true
      GHCR_READ_TOKEN:
        required: true

jobs:
  deploy:
    name: Deploy approved SHA to production VM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      DEPLOY_REF: ${{ inputs.deploy_ref }}
      SERVER_DEPLOY_PATH: ${{ vars.SERVER_DEPLOY_PATH }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}

    steps:
      - name: Diagnose deployment SSH key fingerprint
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          ssh_key_file="$(mktemp)"
          trap 'rm -f "$ssh_key_file"' EXIT
          chmod 600 "$ssh_key_file"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_key_file"
          ssh-keygen -y -f "$ssh_key_file" | ssh-keygen -lf - | awk '{print $2}'

      - name: Deploy over SSH
        # appleboy/ssh-action v1.2.5, pinned to its verified release commit.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          command_timeout: 20m
          envs: IMAGE_TAG,DEPLOY_REF,SERVER_DEPLOY_PATH,GHCR_USERNAME,GHCR_READ_TOKEN
          script: |
            set -Eeuo pipefail
            : "${IMAGE_TAG:?IMAGE_TAG is required}"
            : "${DEPLOY_REF:?DEPLOY_REF is required}"
            : "${SERVER_DEPLOY_PATH:?SERVER_DEPLOY_PATH is required}"
            : "${GHCR_USERNAME:?GHCR_USERNAME is required}"
            : "${GHCR_READ_TOKEN:?GHCR_READ_TOKEN is required}"
            cd "$SERVER_DEPLOY_PATH"
            git fetch origin "$IMAGE_TAG"
            git checkout --force --detach FETCH_HEAD
            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            IMAGE_TAG="$IMAGE_TAG" bash scripts/deploy/deploy-vm.sh
